name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    name: flake check (eval-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes ca-derivations dynamic-derivations
            accept-flake-config = true
      # `nix flake check --no-build` enumerates every package, including
      # attn-kernels-xe-2 (and everything downstream of it: vllm-xpu-kernels,
      # vllm-xpu, …). That family's dyn-drv build does
      # `builtins.readFile "${configureDrv}/repo/tu_manifest.json"` at eval
      # time, which forces configureDrv realisation — i.e. compiling cmake +
      # the full XPU/torch stack on the runner. Outside the scope of an
      # eval-only sanity check on a vanilla GH runner. Eval the IFD-free
      # leaves instead; the dyn-drv targets are exercised end-to-end by the
      # self-hosted build matrix below.
      - name: eval IFD-free leaf packages
        run: |
          set -euo pipefail
          for pkg in \
              intel-oneapi intel-pti \
              torch-xpu triton-xpu \
              flash-linear-attention auto-round-xpu \
              quantize kl-eval; do
            echo "::group::eval $pkg"
            nix eval ".#$pkg.drvPath" >/dev/null
            echo "::endgroup::"
          done

  build:
    name: build ${{ matrix.package }}
    needs: flake-check
    if: vars.SELF_HOSTED_RUNNER_AVAILABLE == 'true'
    runs-on: [self-hosted, x86_64-linux, vllm-xpu-nix]
    strategy:
      fail-fast: false
      matrix:
        package:
          - intel-oneapi
          - intel-pti
          - torch-xpu
          - triton-xpu
          - attn-kernels-xe-2
          - gdn-attn-kernels-xe-2
          - mqa-logits-kernels-xe-2
          - grouped-gemm-xe-2
          - grouped-gemm-xe-default
          - vllm-xpu-kernels
    steps:
      - uses: actions/checkout@v5
      - run: nix build .#${{ matrix.package }} --no-link --print-out-paths
